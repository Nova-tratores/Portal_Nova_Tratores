    - generic [ref=f3e5]: Nova Tratores · Portal Corporativo
    - heading "Tutorial — PPV e Catálogo de Peças" [level=1] [ref=f3e6]
    - paragraph [ref=f3e7]: Para o Setor de Peças. Este guia mostra, passo a passo e com imagens do sistema, como usar o módulo PPV (Pedido de Peças para Venda) e o Catálogo de peças Mahindra no portal.
  - heading "Parte 1 O módulo PPV" [level=2] [ref=f3e8]
  - paragraph [ref=f3e9]: O PPV é onde ficam os pedidos de peças (venda balcão, peças para técnico, orçamentos de peças e remessas). Cada pedido é um card que anda por fases (Orçamento → Execução → Concluída), acompanhando a O.S. quando estiver vinculada.
