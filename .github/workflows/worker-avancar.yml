# Avança a branch `worker` para o `main` uma vez por dia. O serviço portal-worker do
# Railway (robôs) deploya dessa branch, não do main — assim ele reinicia UMA vez por dia,
# à noite, em vez de a cada push de tela (04/11/2026: 27 dos 36 commits de dois dias
# tocavam src/lib, e o worker reiniciava 11–13x por dia, interrompendo syncs).
# Correção urgente de robô: rodar este workflow pelo botão "Run workflow" (ou
# `git push origin origin/main:worker` na máquina).
# Horário: ALMOÇO (05/11/2026, decisão do José) — 11:40 BRT no papel; o GitHub costuma
# atrasar, então cai perto do meio-dia, quando a lentidão do reinício quase não pega
# ninguém. Antes era 23:30, no meio da cadeia pesada da noite (20:00–00:45 BRT).
# Trava: no agendado, só avança entre 11:30 e 13:30 BRT (o botão "Run workflow" avança a
# qualquer hora).
# 09/11/2026: com UM horário só, o worker ficou parado 4 dias. O GitHub atrasou o cron
# 4,5–6,5 h todo dia, a execução caía às 16–18 h BRT, a trava pulava, e o sync da Rota
# Exata seguiu com o código velho, duplicando as geocercas. Agora dispara de hora em hora:
# a execução que cair no almoço avança, e as outras saem sem fazer nada (worker == main
# também sai). Rede de segurança: se o worker estiver há mais de 48 h atrás do main,
# avança no próximo disparo, a qualquer hora.
name: Worker - Avançar branch para o main

on:
  schedule:
    - cron: '40 6-16 * * *'   # de hora em hora; só o que cair 11:30–13:30 BRT avança
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  avancar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fast-forward worker -> main
        run: |
          if [ "$(git rev-parse origin/worker 2>/dev/null)" = "$(git rev-parse origin/main)" ]; then
            echo "worker já está no main: nada a fazer (não reinicia)."; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            hm=$(TZ=America/Sao_Paulo date +%H%M)
            # idade do commit mais antigo do main que o worker ainda não tem
            pendente=$(git log --format=%ct origin/worker..origin/main | sort -n | head -1)
            idade_h=$(( ( $(date +%s) - ${pendente:-$(date +%s)} ) / 3600 ))
            if [ "$hm" -lt 1130 ] || [ "$hm" -gt 1330 ]; then
              if [ "$idade_h" -lt 48 ]; then
                echo "Fora do almoço ($hm BRT), worker ${idade_h} h atrás: espera o almoço."; exit 0
              fi
              echo "Fora do almoço ($hm BRT), mas o worker está ${idade_h} h atrás: avança assim mesmo."
            fi
          fi
          echo "worker estava em $(git rev-parse --short origin/worker 2>/dev/null || echo '(sem branch)')"
          git push origin origin/main:refs/heads/worker
          echo "worker agora em $(git rev-parse --short origin/main)"
