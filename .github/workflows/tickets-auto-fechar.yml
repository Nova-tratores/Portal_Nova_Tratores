# Tickets — auto-fechamento (ADR-004): ticket "resolvido" há 7+ dias sem
# manifestação do solicitante fecha automaticamente. Roda 1x por dia.
name: Tickets - Auto-fechar resolvidos

on:
  # Desde 15/10/2026 este agendamento roda no AGENDADOR do portal (tela /agendamentos,
  # docs/omie-fila-agendador-plano.md, etapa 3). Fica só o botão manual como reserva
  # até 14/11/2026, depois este arquivo é apagado. Horário antigo: cron: '20 9 * * *'   # 06:20 BRT
  workflow_dispatch: {}

jobs:
  auto-fechar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de auto-fechamento
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/tickets/cron/auto-fechar"
