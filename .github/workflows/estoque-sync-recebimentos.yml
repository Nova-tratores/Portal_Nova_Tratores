# RESERVA desde 04/11/2026: o agendador do portal roda o sync COMPLETO às 22:00 BRT no
# worker (tarefa estoque-sync-recebimentos); de dia o recente de 45 dias roda a cada
# 10 min (pecas-alocacao-rapido). A rota pula se o portal rodou bem nas últimas 26 h.
name: Estoque - Sync recebimentos NF-e (reserva)

# Sincroniza os recebimentos de NF-e do Omie (ListarRecebimentos ->
# recebimentos_nfe) para todas as contas, em janela comercial.
# Necessário porque o portal roda no Railway e o vercel.json não dispara cron.
# Requer os secrets do GitHub: PORTAL_URL e CRON_SECRET.

on:
  schedule:
    - cron: '0 12 * * *'   # 09:00 BRT (reserva: só roda se o worker falhou à noite)
  workflow_dispatch: {}          # permite rodar manualmente

jobs:
  sync-recebimentos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar sync de recebimentos
        run: |
          curl -fsS --max-time 600 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/estoque/cron/sync-recebimentos" \
            -w "\nsync-recebimentos: HTTP %{http_code}\n"
