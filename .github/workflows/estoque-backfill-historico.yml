name: Estoque - Backfill histórico (snapshot + NF entrada)

# Correção PONTUAL do histórico do "Cruzamento por Família".
#
# Por que existe:
#   - Estoque máquina/peça por mês: a Omie NÃO guarda saldo histórico (só o
#     atual). O histórico vive em estoque_familia_snapshot / estoque_tipo_snapshot.
#     O mês corrente é semeado pelos crons de estoque, mas os meses ANTERIORES
#     nunca foram — este job reconstrói via posição-por-data na Omie.
#   - NF entrada máquina/peça por mês: vem de notas_entrada, que o cron
#     estoque-sync-compras só mantém nos últimos 3 meses. Este job amplia para 12.
#
# IMPORTANTE — rodar UMA CONTA POR VEZ:
#   O backfill de snapshot é pesado (1 consulta posição-por-data na Omie por mês)
#   e roda em background no Railway. Rodar as duas contas juntas estoura o tempo
#   de vida do processo (a 1ª conta fica pela metade e a 2ª não roda). Por isso a
#   opção "ambas" foi REMOVIDA: rode com conta=NOVA, espere terminar, depois
#   rode com conta=CASTRO. Com desde=2025-07 são só ~12 meses por conta.
#
# Caveats:
#   - O snapshot histórico classifica o saldo pela FAMÍLIA ATUAL do cadastro e
#     usa o CMC da posição-por-data: é uma reconstrução aproximada.
#   - Jobs longos e fire-and-forget: o curl responde 200 na hora e o
#     processamento segue em background no Railway (ver logs). Conferir depois
#     com o script _diag_tmp.mjs ou abrindo o gráfico.
#   - Requer os secrets PORTAL_URL e CRON_SECRET.

on:
  workflow_dispatch:
    inputs:
      desde:
        description: 'Backfill do snapshot de estoque a partir de (YYYY-MM)'
        required: true
        default: '2025-07'
      conta:
        description: 'Conta Omie (rode UMA por vez: primeiro NOVA, depois CASTRO)'
        required: true
        type: choice
        default: 'NOVA'
        options:
          - NOVA
          - CASTRO

jobs:
  backfill-historico:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Backfill snapshot de estoque (posição-por-data) — conta ${{ github.event.inputs.conta }}
        run: |
          curl -fsS --max-time 600 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/estoque/cron/backfill-snapshot?desde=${{ github.event.inputs.desde }}&conta=${{ github.event.inputs.conta }}" \
            -w "\nbackfill-snapshot: HTTP %{http_code}\n"

      - name: Backfill NF entrada (notas_entrada, 12 meses — NOVA + CASTRO)
        run: |
          curl -fsS --max-time 600 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/estoque/cron/sync-compras?meses=12" \
            -w "\nsync-compras: HTTP %{http_code}\n"
