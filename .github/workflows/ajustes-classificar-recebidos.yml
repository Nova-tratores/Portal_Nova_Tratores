name: Ajustes - Classificar produtos recebidos (robô)

# Robô diário: produtos recém-recebidos SEM FAMÍLIA e com valor < R$10.000 →
# família "Peças" + sugere o "Tipo:" + cria tarefas (confirmar localização/Tipo)
# para o responsável de peças em /tarefas.
# Chama /api/ajustes/cron/classificar-recebidos (fire-and-forget). Requer secrets
# PORTAL_URL e CRON_SECRET.
#
# Roda 2×/dia (08:00 + 13:00 UTC) DE PROPÓSITO: o scheduler do GitHub Actions é
# best-effort e às vezes atrasa muito ou PULA o horário sob carga (ex.: 27/08/2026
# o run das 08:00 não disparou). O robô é idempotente — produto já com família não
# reaparece —, então a 2ª passada roda vazia se a 1ª já pegou tudo; se a 1ª pulou,
# a 2ª cobre o dia. Não duplicar in-process (instrumentation.ts) p/ não disputar a
# mesma chave Omie do AlterarProduto.

on:
  workflow_dispatch:
    inputs:
      conta:
        description: 'Limitar a uma conta (NOVA/CASTRO); vazio = as duas'
        required: false
        default: ''
  schedule:
    - cron: '0 8 * * *'    # diário 08:00 UTC ≈ 05:00 BRT
    - cron: '0 13 * * *'   # backup 13:00 UTC ≈ 10:00 BRT (cobre o dia se o 1º pular)

jobs:
  classificar-recebidos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Disparar robô de classificação
        run: |
          Q=""
          if [ -n "${{ github.event.inputs.conta }}" ]; then Q="?conta=${{ github.event.inputs.conta }}"; fi
          curl -sS --max-time 600 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/ajustes/cron/classificar-recebidos${Q}" \
            -w "\nclassificar-recebidos: HTTP %{http_code} em %{time_total}s\n" || echo "curl encerrou (fire-and-forget: o servidor continua)"
