# RESERVA desde 05/11/2026: o agendador roda ajustes-sync-notas a cada 3 h no worker.
# A rota pula se o agendador do portal rodou bem há pouco (agendadorJaRodou).
name: Ajustes - Sync Notas de Saida (incremental)

# Espelha as notas fiscais de saida (NF-e produto + NFS-e servico) do Omie no
# Supabase (portal_nt_notas_saida) para a busca em /ajustes/notas ser instantanea.
# Janela movel (ultimos ~90 dias) -> pega notas novas e cancelamentos recentes.
# O Portal roda no Railway (vercel.json nao dispara cron), por isso GitHub Action.
# Requer os secrets do GitHub: PORTAL_URL e CRON_SECRET.

on:
  schedule:
    - cron: '0 12 * * *'   # reserva (ver cabeçalho)
  workflow_dispatch: {}        # permite rodar manualmente pelo botao "Run workflow"

jobs:
  sync-notas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Disparar sync incremental das notas de saida
        run: |
          curl -fsS --max-time 800 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/ajustes/cron/sync-notas" \
            -w "\nsync-notas: HTTP %{http_code}\n"
