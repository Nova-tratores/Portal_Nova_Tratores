# Reuniões — de hora em hora (o corte também é calculado na leitura — o cron só grava e notifica).
name: Reunioes - Corte da pauta

on:
  # Desde 15/10/2026 este agendamento roda no AGENDADOR do portal (tela /agendamentos,
  # docs/omie-fila-agendador-plano.md, etapa 3). Fica só o botão manual como reserva
  # até 14/11/2026, depois este arquivo é apagado. Horário antigo: cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  corte:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota do cron
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/reunioes/cron/corte-pauta"
