# Avisos agendados — publica os que chegaram na hora marcada e avisa o criador.
# Antes rodava a cada 5 min (288x/dia, martelando o Supabase à toa). Passou para
# a cada 15 min em horário comercial: corta ~95% das execuções e os avisos
# agendados ainda publicam (com até 15 min de atraso).
name: Avisos - Publicar agendados

on:
  # Desde 15/10/2026 este agendamento roda no AGENDADOR do portal (tela /agendamentos,
  # docs/omie-fila-agendador-plano.md, etapa 3). Fica só o botão manual como reserva
  # até 14/11/2026, depois este arquivo é apagado. Horário antigo: cron: '*/15 9-23 * * *'   # a cada 15 min, 06:00–20:00 BRT (09–23 UTC)
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de publicação de agendados
        run: |
          curl -fsS --max-time 120 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/avisos/cron/publicar"
