# DESLIGADO do GitHub em 05/11/2026 (só 'Run workflow'): o agendador chama /api/pecas/unidades/cron/abate de 30 em 30 min (rota-interna, no worker).
# apagar este arquivo em/depois de 05/12/2026 (reserva de 30 dias).
# Rastreio de peças — ABATE automático: cruza as unidades retiradas pra OS
# (status 'liberada') com o relatório do técnico (PecasInfo) e transiciona:
# usada -> aplicada · não usada/devolvida -> devolução pendente.
name: Pecas - Abate de unidades rastreadas

on:
  workflow_dispatch: {}

jobs:
  abater:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota do cron de abate
        run: |
          curl -fsS --max-time 120 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/pecas/unidades/cron/abate"
