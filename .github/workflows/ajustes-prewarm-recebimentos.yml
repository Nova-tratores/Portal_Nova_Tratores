name: Ajustes - Recebimentos pendentes (atualização diária)

# Atualiza o cache de "Recebimentos pendentes" (janela grande 01/11/2022 → hoje) para
# NOVA + CASTRO. Merge INCREMENTAL: recomputa só a janela recente e mantém o histórico
# congelado no snapshot (recebimento_pendentes_cache). A tela lê o snapshot (instantâneo).
#
# 1×/dia às 07:00 UTC (~04:00 BRT), fora de pico. Fire-and-forget: se o compute demorar
# além do --max-time, o servidor termina em segundo plano e grava o snapshot mesmo assim.
# Use "workflow_dispatch" com seed=1 para forçar o recompute COMPLETO (seed/reconciliação).
# Requer os secrets PORTAL_URL e CRON_SECRET.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Recompute COMPLETO (01/11/2022→hoje) em vez do incremental'
        type: boolean
        default: false
  schedule:
    - cron: '0 7 * * *'   # diário 07:00 UTC = ~04:00 BRT

jobs:
  atualizar-recebimentos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Atualizar cache de recebimentos (incremental ou seed)
        run: |
          SEED=""
          if [ "${{ github.event.inputs.seed }}" = "true" ]; then SEED="?seed=1"; fi
          curl -sS --max-time 900 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/ajustes/recebimentos-pendentes/atualizar-dia${SEED}" \
            -w "\natualizar-dia: HTTP %{http_code} em %{time_total}s\n" || echo "curl encerrou (fire-and-forget: o servidor continua e grava o snapshot)"
