# Carrinhos — auto-fechamento: carrinho aberto há 7+ dias (expira_em) fecha
# automaticamente e vai para "fechados". Roda 1x por dia.
name: Carrinhos - Auto-fechar expirados

on:
  # Desde 15/10/2026 este agendamento roda no AGENDADOR do portal (tela /agendamentos,
  # docs/omie-fila-agendador-plano.md, etapa 3). Fica só o botão manual como reserva
  # até 14/11/2026, depois este arquivo é apagado. Horário antigo: cron: '30 9 * * *'   # 06:30 BRT
  workflow_dispatch: {}

jobs:
  fechar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de auto-fechamento
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/carrinhos/cron/fechar-expirados"
