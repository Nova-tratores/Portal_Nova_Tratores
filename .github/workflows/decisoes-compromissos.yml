# Livro de Decisões (Visão C) — varre pareceres com prazo_compromisso vencido
# cuja SC ainda não chegou ao PC e alerta os envolvidos. Roda 1x por dia.
name: Decisoes - Compromissos vencidos

on:
  schedule:
    - cron: '30 10 * * *'   # 07:30 BRT
  workflow_dispatch: {}

jobs:
  compromissos:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota de compromissos vencidos
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/decisoes/cron/compromissos"
