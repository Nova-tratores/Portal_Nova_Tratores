# POS — lembrete de separação de peças (véspera do serviço às 15h BRT).
# Serviço na segunda → o lembrete sai na sexta (a rota decide; domingo não envia).
name: POS - Separar pecas (lembrete 15h)

on:
  # Desde 15/10/2026 este agendamento roda no AGENDADOR do portal (tela /agendamentos,
  # docs/omie-fila-agendador-plano.md, etapa 3). Fica só o botão manual como reserva
  # até 14/11/2026, depois este arquivo é apagado. Horário antigo: cron: '0 18 * * *'   # 15:00 BRT
  workflow_dispatch: {}

jobs:
  lembrete:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota do lembrete
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/pos/cron/separar-pecas"
