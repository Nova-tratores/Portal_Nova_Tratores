# POS — Vigia de revisões: 1x por dia recalcula a pendência Mahindra das OS
# dos últimos 60 dias (cheque de revisão da própria OS e das anteriores,
# inspeção de pré-entrega). Pendência nova → exclamação no card + notificação.
name: POS - Vigia de revisoes

on:
  # Desde 15/10/2026 este agendamento roda no AGENDADOR do portal (tela /agendamentos,
  # docs/omie-fila-agendador-plano.md, etapa 3). Fica só o botão manual como reserva
  # até 14/11/2026, depois este arquivo é apagado. Horário antigo: cron: '40 9 * * *'   # 06:40 BRT
  workflow_dispatch: {}

jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar rota do vigia
        run: |
          curl -fsS --max-time 300 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PORTAL_URL }}/api/pos/cron/vigia-revisoes"
