<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota da Nova Tratores</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: rota principal em 9 estações (horizontal) com ramais pendurados → abaixo, à esquerda o detalhe da estação, à direita "Furos e ganhos". */
:root {
  --bg: #f2f4ee; --surface: #ffffff; --line: #dde2d6; --ink: #1e231b; --muted: #626d5b; --soft: #eef2e8;
  --road: #3a3e44; --road-line: #f2c200;
  --vendas: #2f6b2a; --posvendas: #b4670f; --garantia: #b4373f; --pecas: #2b6cb0; --financeiro: #5b4a9e;
  --ok: #2f7d4a; --ok-soft: #e3f1e7; --back: #b5482f; --back-soft: #f9e4de; --wait: #8a6d00; --wait-soft: #f6eecb;
  --area: #2b6cb0; --area-soft: #e0ebf8; --end: #626a75; --end-soft: #eaecef;
  --hole: #c62f2f; --hole-soft: #fde5e3; --shade: rgba(25, 35, 20, .12);
  --f-title: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-sign: "Barlow Semi Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131812; --surface: #1b2219; --line: #2e382b; --ink: #e6ebe1; --muted: #9aa692; --soft: #20291e;
  --road: #4b5057; --road-line: #e0b400;
  --vendas: #7cc36f; --posvendas: #e3a849; --garantia: #ef7d84; --pecas: #7fb0e8; --financeiro: #a99be6;
  --ok: #6fc48a; --ok-soft: #1f3324; --back: #f08b6e; --back-soft: #3a231c; --wait: #d9bf4a; --wait-soft: #302b15;
  --area: #7fb0e8; --area-soft: #1c2a3b; --end: #a3a9b3; --end-soft: #262a2f; --hole: #ff7b72; --hole-soft: #3d1f1d; --shade: rgba(0,0,0,.45);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131812; --surface: #1b2219; --line: #2e382b; --ink: #e6ebe1; --muted: #9aa692; --soft: #20291e;
  --road: #4b5057; --road-line: #e0b400;
  --vendas: #7cc36f; --posvendas: #e3a849; --garantia: #ef7d84; --pecas: #7fb0e8; --financeiro: #a99be6;
  --ok: #6fc48a; --ok-soft: #1f3324; --back: #f08b6e; --back-soft: #3a231c; --wait: #d9bf4a; --wait-soft: #302b15;
  --area: #7fb0e8; --area-soft: #1c2a3b; --end: #a3a9b3; --end-soft: #262a2f; --hole: #ff7b72; --hole-soft: #3d1f1d; --shade: rgba(0,0,0,.45);
  color-scheme: dark; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
.wrap { max-width: 1480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 18px 48px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--area); outline-offset: 2px; }

header.top { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: end; justify-content: space-between; }
h1 { margin: 0; font: 800 clamp(28px, 3.6vw, 40px)/1 var(--f-title); text-transform: uppercase; letter-spacing: .01em; }
.lede { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.play { display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 18px; font: 700 16px/1 var(--f-sign); cursor: pointer; }
.play:hover { opacity: .9; }

/* ---- rota ---- */
.route-box { margin-top: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 10px; overflow-x: auto; }
.route { position: relative; display: grid; grid-template-columns: repeat(9, minmax(128px, 1fr)); grid-template-rows: auto 64px auto; min-width: 1180px; }
.branches-up, .branches-down { display: flex; flex-direction: column; gap: 4px; align-items: center; padding: 0 4px; }
.branches-up { grid-row: 1; justify-content: flex-end; padding-bottom: 6px; min-height: 64px; }
.branches-down { grid-row: 3; justify-content: flex-start; padding-top: 6px; min-height: 64px; }
.branch { position: relative; font: 600 12.5px/1.15 var(--f-sign); border: 1.5px solid; border-radius: 6px; padding: 4px 8px; background: var(--surface); cursor: pointer; text-align: center; }
.branch::after { content: ""; position: absolute; left: 50%; width: 0; border-left: 2px dashed currentColor; opacity: .6; }
.branches-up .branch:last-child::after { top: 100%; height: 10px; }
.branches-down .branch:first-child::after { bottom: 100%; height: 10px; }
.branch small { display: block; font: 500 10.5px/1.1 var(--f-sign); opacity: .8; }
.road { grid-row: 2; grid-column: 1 / -1; align-self: center; height: 26px; background: var(--road); border-radius: 13px; position: relative; }
.road::after { content: ""; position: absolute; left: 14px; right: 14px; top: 12px; border-top: 2px dashed var(--road-line); }
.station { grid-row: 2; position: relative; z-index: 2; display: flex; justify-content: center; align-items: center; }
.st-btn { display: grid; justify-items: center; gap: 2px; background: none; border: 0; cursor: pointer; padding: 0; }
.dot { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 4px solid var(--c); display: grid; place-items: center; font: 800 18px/1 var(--f-title); color: var(--c); box-shadow: 0 2px 8px var(--shade); transition: transform .15s; position: relative; }
.st-btn:hover .dot { transform: scale(1.08); }
.station.on .dot { background: var(--c); color: var(--surface); transform: scale(1.12); }
.station.flash .dot { animation: pulse 1s ease-out 2; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 var(--hole); } 100% { box-shadow: 0 0 0 16px transparent; } }
.holes { position: absolute; top: -8px; right: -10px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--hole); color: #fff; font: 700 11.5px/20px var(--f-sign); text-align: center; }
.names { display: contents; }
.st-name { grid-row: 3; text-align: center; font: 700 15px/1.1 var(--f-sign); margin-top: 6px; pointer-events: none; }
.label-row { display: grid; grid-template-columns: repeat(9, minmax(128px, 1fr)); min-width: 1180px; margin-top: 4px; }
.label-row div { text-align: center; padding: 0 4px; }
.label-row b { display: block; font: 700 15px/1.1 var(--f-sign); cursor: pointer; }
.label-row span { display: block; font: 500 11.5px/1.2 var(--f-sign); color: var(--muted); }
.label-row .area-dots { display: inline-flex; gap: 3px; margin-top: 3px; }
.label-row .area-dots i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.loop { min-width: 1180px; margin: 8px 22px 0; height: 22px; border: 2px dashed var(--muted); border-top: 0; border-radius: 0 0 22px 22px; opacity: .5; position: relative; }
.loop span { position: absolute; left: 50%; bottom: -10px; transform: translateX(-50%); background: var(--surface); padding: 0 8px; font: 600 12px/1 var(--f-sign); color: var(--muted); white-space: nowrap; }
.tractor { position: absolute; z-index: 3; top: calc(50% - 40px); width: 46px; height: 34px; transition: left .9s cubic-bezier(.45,.05,.3,1); pointer-events: none; }
.tractor[hidden] { display: none; }

/* ---- corpo: detalhe + furos ---- */
.body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; align-items: start; }
@media (max-width: 980px) { .body { grid-template-columns: minmax(0, 1fr); } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; min-width: 0; }
.eyebrow { font: 700 12px/1 var(--f-sign); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.card h2 { margin: 4px 0 6px; font: 800 28px/1.05 var(--f-title); text-transform: uppercase; text-wrap: balance; }
.what { margin: 0 0 12px; font-size: 15.5px; max-width: 65ch; }
.chips-areas { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.tag { font: 700 11px/1 var(--f-sign); text-transform: uppercase; letter-spacing: .06em; color: #fff; padding: 4px 7px; border-radius: 4px; }
.steps { display: grid; gap: 10px; }
.step { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.step-h { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.step-h .kind { font: 700 11px/1 var(--f-sign); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.step-h b { font: 600 15.5px/1.3 var(--f-body); }
.step-h .who { font-size: 12.5px; color: var(--muted); }
.step p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.answers { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.ans { font: 500 12.5px/1.2 var(--f-sign); padding: 4px 8px; border-radius: 999px; border: 1px solid transparent; }
.ans b { font-weight: 700; }
.k-s { background: var(--ok-soft); color: var(--ok); }
.k-v { background: var(--back-soft); color: var(--back); border-color: currentColor; }
.k-e { background: var(--wait-soft); color: var(--wait); }
.k-a { background: var(--area-soft); color: var(--area); cursor: pointer; }
.k-f { background: var(--end-soft); color: var(--end); }
.hole-note { margin-top: 8px; font-size: 13px; color: var(--hole); background: var(--hole-soft); border-radius: 6px; padding: 6px 9px; }
details.ramal { border: 1.5px solid; border-radius: 10px; margin-top: 10px; background: var(--surface); }
details.ramal summary { cursor: pointer; padding: 9px 12px; font: 700 15px/1.2 var(--f-sign); list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.ramal summary::-webkit-details-marker { display: none; }
details.ramal summary::after { content: "abrir ▾"; font: 600 12px var(--f-sign); opacity: .7; }
details.ramal[open] summary::after { content: "fechar ▴"; }
details.ramal .steps { padding: 0 10px 10px; }
.legend-mini { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 12px; font-size: 12px; color: var(--muted); align-items: center; }

/* furos */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
.fbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 11px; font: 600 13px/1 var(--f-sign); cursor: pointer; }
.fbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.holes-list { display: grid; gap: 10px; }
.hole-card { border: 1px solid var(--line); border-left: 4px solid var(--hole); border-radius: 10px; padding: 10px 12px; background: var(--bg); }
.hole-card.top { border-left-color: var(--ink); }
.hc-head { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.hc-head b { font: 700 16px/1.25 var(--f-sign); }
.prio { font: 800 12px/1 var(--f-sign); background: var(--ink); color: var(--surface); border-radius: 4px; padding: 3px 6px; white-space: nowrap; }
.kinds { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
.kind-tag { font: 700 10.5px/1 var(--f-sign); text-transform: uppercase; letter-spacing: .06em; border-radius: 3px; padding: 3px 5px; }
.kt-sistema { background: var(--area-soft); color: var(--area); }
.kt-processo { background: var(--wait-soft); color: var(--wait); }
.kt-esforco { background: var(--end-soft); color: var(--end); }
.hc-rows { display: grid; gap: 4px; margin-top: 7px; font-size: 13.5px; }
.hc-rows div { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 6px; }
.hc-rows dt { font: 700 11.5px/1.6 var(--f-sign); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.hc-rows dd { margin: 0; }
.hc-rows .gain dd { font-weight: 600; color: var(--ok); }
.see { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
.see button { font: 600 12px/1 var(--f-sign); border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 9px; cursor: pointer; }
.see button:hover { border-color: var(--muted); }
.note { margin-top: 12px; font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .tractor { transition: none; } .station.flash .dot { animation: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Rota da Nova Tratores</h1>
      <p class="lede">O caminho que faz a loja girar, do primeiro contato até o cliente voltar a comprar. Clique numa estação para ver o que acontece ali. Os números vermelhos são furos.</p>
    </div>
    <button class="play" type="button" id="play">▶ Seguir o cliente</button>
  </header>

  <section class="route-box" aria-label="Rota principal">
    <div class="route" id="route"></div>
    <div class="label-row" id="labels"></div>
    <div class="loop"><span>↺ cliente satisfeito volta para o começo</span></div>
  </section>

  <div class="body">
    <section class="card" id="detail" aria-live="polite"></section>
    <section class="card" id="furos"></section>
  </div>
</div>
<script>

const furosDe = st => FUROS.filter(f => f.onde.includes(st.id));
let atual = null, tour = null;

const TRACTOR = `<svg class="tractor" id="tractor" viewBox="0 0 46 34" hidden aria-hidden="true">
  <rect x="14" y="4" width="14" height="13" rx="2" style="fill:var(--vendas)"/><rect x="17" y="7" width="8" height="6" style="fill:var(--surface)"/>
  <rect x="6" y="15" width="34" height="8" rx="2" style="fill:var(--vendas)"/><rect x="36" y="10" width="3" height="6" style="fill:var(--road)"/>
  <circle cx="14" cy="25" r="8" style="fill:var(--road)"/><circle cx="14" cy="25" r="3" style="fill:var(--road-line)"/>
  <circle cx="36" cy="28" r="5" style="fill:var(--road)"/><circle cx="36" cy="28" r="2" style="fill:var(--road-line)"/></svg>`;

function renderRoute() {
  let h = `<div class="road"></div>`;
  STATIONS.forEach((st, i) => {
    const col = i + 1;
    const up = st.ramais.filter(r => r[1] === "up"), down = st.ramais.filter(r => r[1] === "down");
    const br = ([id]) => { const r = roadById[id]; return `<button type="button" class="branch" data-st="${st.id}" data-ramal="${id}" style="color:var(--${r.area});border-color:var(--${r.area})">${esc(r.nome.replace("Bastidores: ", ""))}<small>${r.stops.length} etapas</small></button>`; };
    h += `<div class="branches-up" style="grid-column:${col}">${up.map(br).join("")}</div>`;
    const area = stStops(st)[0].area, nf = furosDe(st).length;
    h += `<div class="station" style="grid-column:${col};--c:var(--${area})" data-station="${st.id}"><button type="button" class="st-btn" data-st="${st.id}" aria-label="${esc(st.nome)}"><span class="dot">${i + 1}${nf ? `<span class="holes" title="${nf} furos">${nf}</span>` : ""}</span></button></div>`;
    h += `<div class="branches-down" style="grid-column:${col}">${down.map(br).join("")}</div>`;
  });
  document.getElementById("route").innerHTML = h + TRACTOR;
  document.getElementById("labels").innerHTML = STATIONS.map(st => `<div><b data-st="${st.id}">${esc(st.nome)}</b><span>${esc(st.sub)}</span><span class="area-dots">${stAreas(st).map(a => `<i style="background:var(--${a})" title="${AREAS[a]}"></i>`).join("")}</span></div>`).join("");
}

function stepHTML(p) {
  const ans = (p.s || []).map(([a, k, to, alvo]) => {
    const r = k === "a" && roadById[alvo];
    return `<span class="ans k-${k}" ${r ? `data-goto="${alvo}"` : ""}>${KIND[k]} <b>${esc(a)}</b>${to ? " · " + esc(to) : ""}${r ? ` <u>${esc(r.nome.replace("Bastidores: ", ""))}</u>` : ""}</span>`;
  }).join("");
  return `<div class="step"><div class="step-h"><span class="kind">${p.t === "d" ? "Decisão" : "Etapa"}</span><b>${esc(p.h)}</b><span class="who">· ${esc(p.quem || "")}</span></div>
    ${p.sum ? `<p>${esc(p.sum)}</p>` : ""}${ans ? `<div class="answers">${ans}</div>` : ""}${p.furo ? `<div class="hole-note">⚠ ${esc(p.furo)}</div>` : ""}</div>`;
}

function showStation(id, opts = {}) {
  const st = STATIONS.find(s => s.id === id); if (!st) return;
  atual = id;
  document.querySelectorAll(".station").forEach(s => s.classList.toggle("on", s.dataset.station === id));
  const i = STATIONS.indexOf(st);
  const ramais = st.ramais.map(([rid]) => { const r = roadById[rid];
    return `<details class="ramal" data-ramal="${rid}" style="border-color:var(--${r.area})" ${opts.open === rid ? "open" : ""}><summary style="color:var(--${r.area})">Ramal: ${esc(r.nome)} · ${r.stops.length} etapas</summary><div class="steps">${r.stops.map(stepHTML).join("")}</div></details>`; }).join("");
  const nf = furosDe(st);
  document.getElementById("detail").innerHTML = `
    <div class="eyebrow">Estação ${i + 1} de ${STATIONS.length}</div>
    <h2>${esc(st.nome)}</h2>
    <p class="what">${esc(st.what)}</p>
    <div class="chips-areas">${stAreas(st).map(a => `<span class="tag" style="background:var(--${a})">${AREAS[a]}</span>`).join("")}${nf.length ? `<span class="tag" style="background:var(--hole)">${nf.length} furo${nf.length > 1 ? "s" : ""} aqui</span>` : ""}</div>
    <div class="legend-mini">Respostas: <span class="ans k-s">→ segue</span><span class="ans k-v">↩ volta (retrabalho)</span><span class="ans k-e">⏸ espera</span><span class="ans k-a">⇢ ramal</span><span class="ans k-f">■ fim</span></div>
    <div class="steps">${stStops(st).map(stepHTML).join("")}</div>${ramais}`;
  if (opts.open) { const d = document.querySelector(`details[data-ramal="${opts.open}"]`); if (d) d.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
  moveTractor(i);
  if (!opts.keepFilter) renderFuros(id);
}

function moveTractor(i) {
  const t = document.getElementById("tractor"), route = document.getElementById("route");
  const dot = route.querySelectorAll(".station")[i]; if (!dot) return;
  t.hidden = false;
  t.style.left = (dot.offsetLeft + dot.offsetWidth / 2 - 23) + "px";
}

let filtro = "todos";
function renderFuros(stationId) {
  const st = stationId && STATIONS.find(s => s.id === stationId);
  let lista = FUROS.filter(f => filtro === "todos" || (filtro === "top" ? f.top : f.tipos.includes(filtro)));
  if (st && filtro === "aqui") lista = furosDe(st);
  const btn = (k, t) => `<button type="button" class="fbtn" data-f="${k}" aria-pressed="${filtro === k}">${t}</button>`;
  document.getElementById("furos").innerHTML = `
    <div class="eyebrow">O que dá para ganhar</div><h2>Furos e ganhos</h2>
    <div class="filters">${btn("todos", `Todos (${FUROS.length})`)}${btn("top", "Começar por aqui")}${btn("sistema", "Sistema")}${btn("processo", "Processo")}${st ? btn("aqui", `Só em “${esc(st.nome)}”`) : ""}</div>
    <div class="holes-list">${lista.map(f => `
      <article class="hole-card ${f.top ? "top" : ""}">
        <div class="hc-head"><b>${f.n}. ${esc(f.titulo)}</b>${f.top ? `<span class="prio">Prioridade ${f.n}</span>` : ""}</div>
        <div class="kinds">${f.tipos.map(t => `<span class="kind-tag kt-${t}">${t}</span>`).join("")}<span class="kind-tag kt-esforco">esforço: ${f.esforco}</span></div>
        <dl class="hc-rows"><div><dt>Hoje</dt><dd>${esc(f.hoje)}</dd></div><div><dt>Fazer</dt><dd>${esc(f.fazer)}</dd></div><div class="gain"><dt>Ganho</dt><dd>${esc(f.ganho)}</dd></div></dl>
        <div class="see">${f.onde.map(o => `<button type="button" data-ver="${o}">ver em “${esc(STATIONS.find(s => s.id === o).nome)}”</button>`).join("")}</div>
      </article>`).join("") || `<p class="note">Nenhum furo marcado nesta estação.</p>`}</div>
    <p class="note">Os furos saíram da leitura do código: mostram onde está o problema, não quanto custa. O próximo passo é medir cada um com os números do banco.</p>`;
}

function flash(id) {
  const s = document.querySelector(`.station[data-station="${id}"]`); if (!s) return;
  s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash");
  document.querySelector(".route-box").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

/* tour */
function stopTour() { clearInterval(tour); tour = null; document.getElementById("play").textContent = "▶ Seguir o cliente"; }
document.getElementById("play").addEventListener("click", () => {
  if (tour) { stopTour(); return; }
  let i = 0; showStation(STATIONS[0].id);
  document.getElementById("play").textContent = "❚❚ Pausar";
  tour = setInterval(() => { i++; if (i >= STATIONS.length) { stopTour(); return; } showStation(STATIONS[i].id); }, 4500);
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-ramal].branch"); if (b) { stopTour(); showStation(b.dataset.st, { open: b.dataset.ramal }); return; }
  const s = e.target.closest("[data-st]"); if (s) { stopTour(); showStation(s.dataset.st); return; }
  const g = e.target.closest("[data-goto]"); if (g) {
    const st = STATIONS.find(x => x.ramais.some(([r]) => r === g.dataset.goto)); if (st) { stopTour(); showStation(st.id, { open: g.dataset.goto }); } return; }
  const f = e.target.closest("[data-f]"); if (f) { filtro = f.dataset.f; renderFuros(atual); return; }
  const v = e.target.closest("[data-ver]"); if (v) { stopTour(); showStation(v.dataset.ver, { keepFilter: true }); flash(v.dataset.ver); return; }
});
window.addEventListener("resize", () => { if (atual) moveTractor(STATIONS.findIndex(s => s.id === atual)); });

renderRoute();
showStation("atrair");
</script>
</body>
</html>
